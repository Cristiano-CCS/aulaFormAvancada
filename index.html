<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oficina de CSS - Cartão Interativo</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>Carne Bovina</h1>
  </header>

  <main>
    <div class="cartao">
      <h2>Os cortes de bovinos de carne</h2>

      <!-- IMAGEM CENTRAL (Usa uma foto de exemplo que já funciona, mas podem trocar o link) -->
      <div class="area-imagem">
        <img 
          src="images.jpg" 
          alt="Tipos de corte de carne bovina" 
          class="foto-destaque"
        >
      </div>

      <p>Tipos de corte de carne bovina.</p>

      <!-- FORMULÁRIO INTERATIVO -->
      <form>
        <h3>Participe da Enquete</h3>

        <p>
          <label for="nome-visitante">Seu Nome:</label>
          <input type="text" id="nome-visitante" placeholder="Digite seu nome">
        </p>

        <!-- Exemplo de RADIO (Escolha ÚNICA) -->
        <fieldset>
          <legend>1. Escolha apenas UMA opção favorita:</legend>
          
          <input type="radio" id="op1" name="favorito" value="opcao1">
          <label for="op1">Primeira opção Picanha</label><br>

          <input type="radio" id="op2" name="favorito" value="opcao2">
          <label for="op2">Segunda opção Filé Mignon</label>
        </fieldset>

        <!-- Exemplo de CHECKBOX (Escolha MÚLTIPLA - Novidade!) -->
        <fieldset>
          <legend>2. Marque TODAS as opções de corte de carne bovina que você mais gosta (Checkbox):</legend>

          <input type="checkbox" id="check1" name="interesses" value="item1">
          <label for="check1">Peito</label><br>

          <input type="checkbox" id="check2" name="interesses" value="item2">
          <label for="check2">Pescoço</label><br>

          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Cupim</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Acém</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Paleta</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Ossobuco</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Capa de filé</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Aba do filé</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Ponta de agulha</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Filé de costela</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Contrafilé</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Alcatra</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Maminha</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Fraldinha</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Patinho</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Colxão duro</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Colxão mole</label><br>
          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Lagarto</label><br>
        </fieldset>

        <button type="submit">Enviar Respostas</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Atividade de fixação de CSS - 2026</p>
  </footer>

</body>
</html>
